<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Recipe Builder</h1>
        <p class="subtitle">Create a meal idea from ingredients you already have.</p>

        <form id="recipe-form" class="form">
          <label for="ingredients">Ingredients</label>
          <textarea
            id="ingredients"
            name="ingredients"
            rows="4"
            placeholder="e.g. chicken, spinach, eggs, rice"
            required
          ></textarea>

          <div class="row">
            <div>
              <label for="dietary">Dietary preference</label>
              <select id="dietary" name="dietary" required>
                <option value="high protein">High protein</option>
                <option value="quick meal">Quick meal</option>
                <option value="gut friendly">Gut friendly</option>
              </select>
            </div>

            <div>
              <label for="meal">Meal type</label>
              <select id="meal" name="meal" required>
                <option value="Breakfast">Breakfast</option>
                <option value="Lunch">Lunch</option>
                <option value="Dinner">Dinner</option>
              </select>
            </div>
          </div>

          <button type="submit">Generate Recipe</button>
        </form>
      </section>

      <section id="output" class="card output" aria-live="polite">
        <h2>Your recipe will appear here</h2>
        <p>Enter ingredients and click <strong>Generate Recipe</strong>.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
